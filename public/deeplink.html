<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Track Park</title>

    <!-- Мета-теги для красивого превью в мессенджерах (Telegram, WhatsApp) -->
    <meta property="og:title" content="Join JS Track Park Beta" />
    <meta property="og:description" content="Присоединяйтесь к тестированию приложения для водителей. Нажмите, чтобы открыть или скачать." />
    <meta property="og:image" content="https://js-truck-park.web.app/assets/logo.png" />

    <script>
        window.onload = function() {
            // 1. Парсим текущие параметры
            const urlParams = new URLSearchParams(window.location.search);
            const route = urlParams.get('route') || 'homePage';
            const queryString = window.location.search;

            // 2. Пытаемся открыть приложение через кастомную схему (План Б)
            // Это сработает мгновенно, если приложение уже установлено
            const appLink = `jstrackpark://js-truck-park.web.app/${route}${queryString}`;
            window.location.href = appLink;

            // 3. Таймер для тех, у кого приложения НЕТ
            // Если через 2.5 секунды страница не закрылась - делаем редирект в стор
            setTimeout(function() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;

                // Опубликованные страницы приложения в магазинах
                const playStoreUrl = "https://play.google.com/store/apps/details?id=com.mycompany.jstrackpark";
                const appStoreUrl = "https://apps.apple.com/app/id6773738276";
                const webFallback = "https://js-truck-park.web.app/support.html";

                if (/android/i.test(userAgent)) {
                    // Если это Android - в Google Play
                    window.location.href = playStoreUrl;
                } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    // Если это iOS - в App Store
                    window.location.href = appStoreUrl;
                } else {
                    // Если зашли с компьютера - на страницу поддержки
                    window.location.href = webFallback;
                }
            }, 2500);
        };
    </script>
</head>
<body style="text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding-top: 100px; color: #333; background-color: #ffffff;">

    <div id="loader">
        <h2 style="font-weight: 600;">Redirecting to JS Track Park...</h2>
        <div style="margin: 30px auto; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #1E88E5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="color: #666;">If you don't have the app installed, <br>you will be redirected to the store.</p>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

</body>
</html>
